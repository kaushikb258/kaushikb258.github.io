ct x="650" y="187" width="245" height="290" rx="13" fill="#e7efff" stroke="#6f8dc0" stroke-width="2"/><text x="772.5" y="219" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Gemma backbone</text><text x="772.5" y="249" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Multimodal prefix</text><text x="772.5" y="273" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle"></text><text x="772.5" y="297" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">18 transformer layers</text><text x="772.5" y="321" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">2,048 hidden dimensions</text><text x="772.5" y="345" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle"></text><text x="772.5" y="369" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Autoregressive generation</text><rect x="980" y="135" width="270" height="104" rx="13" fill="#fff2df" stroke="#d5a055" stroke-width="2"/><text x="1115.0" y="167" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Action tokens</text><text x="1115.0" y="197" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Variable-length sequence</text><text x="1115.0" y="221" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">FAST IDs + formatting</text><rect x="980" y="300" width="270" height="105" rx="13" fill="#fff2df" stroke="#d5a055" stroke-width="2"/><text x="1115.0" y="332" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">FAST detokenization</text><text x="1115.0" y="362" font-family="Arial,sans-serif" font-size=
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img"><title>pi0-FAST architecture</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#658299"/></marker></defs><rect width="1280" height="640" fill="white"/><text x="35" y="39" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#304359" text-anchor="start">pi0-FAST: from observations to action tokens</text><text x="35" y="67" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="start">The autoregressive VLA pathway used in these experiments</text><rect x="30" y="110" width="235" height="112" rx="13" fill="#eaf3ff" stroke="#729bd3" stroke-width="2"/><text x="147.5" y="142" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Two RGB views</text><text x="147.5" y="172" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">External + eye-in-hand</text><text x="147.5" y="196" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Resize to 224 × 224</text><rect x="320" y="110" width="230" height="112" rx="13" fill="#eaf3ff" stroke="#729bd3" stroke-width="2"/><text x="435.0" y="142" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Shared SigLIP ViT</text><text x="435.0" y="172" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Visual embeddings</text><text x="435.0" y="196" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">So400m / 14</text><rect x="30" y="285" width="235" height="110" rx="13" fill="#f0edff" stroke="#a091d3" stroke-width="2"/><text x="147.5" y="317" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" tex
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 520" role="img"><title>FAST tokenization and detokenization</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#658299"/></marker></defs><rect width="1280" height="520" fill="white"/><text x="34" y="42" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#304359" text-anchor="start">FAST+: encode demonstrations, decode predictions</text><text x="34" y="77" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="start">Temporal DCT per action dimension; BPE compresses the flattened coefficient symbols.</text><rect x="30" y="135" width="225" height="117" rx="13" fill="#eaf3ff" stroke="#729bd3" stroke-width="2"/><text x="142.5" y="167" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Action chunk</text><text x="142.5" y="197" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Normalized actions</text><text x="142.5" y="221" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">10 × 7</text><path d="M255 194 H270" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="277" y="135" width="225" height="117" rx="13" fill="#eaf3ff" stroke="#729bd3" stroke-width="2"/><text x="389.5" y="167" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Temporal DCT</text><text x="389.5" y="197" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Full coefficient matrix</text><text x="389.5" y="221" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">10 × 7</text><path d="M502 194 H517" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="524" y="135" width="225" height="117" rx="13" fill="#fff2df" stroke="#d5a055" stroke-width="2"/><text x="636.5" y="167" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Scale &amp; round</text><text x="636.5" y="197" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Multiply by 10</text><text x="636.5" y="221" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Quantized coefficients</text><path d="M749 194 H764" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="771" y="135" width="225" height="117" rx="13" fill="#fff2df" stroke="#d5a055" stroke-width="2"/><text x="883.5" y="167" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Flatten + BPE</text><text x="883.5" y="197" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">70 coefficient symbols</text><text x="883.5" y="221" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Variable token count</text><path d="M996 194 H1011" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="1018" y="135" width="225" height="117" rx="13" fill="#fff2df" stroke="#d5a055" stroke-width="2"/><text x="1130.5" y="167" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Action tokens</text><text x="1130.5" y="197" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">FAST+ vocabulary</text><text x="1130.5" y="221" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">2,048 entries</text><text x="30" y="120" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#305783" text-anchor="start">TRAINING TARGETS</text><rect x="30" y="330" width="225" height="117" rx="13" fill="#f0edff" stroke="#a091d3" stroke-width="2"/><text x="142.5" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Predicted tokens</text><text x="142.5" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Extract action segment</text><text x="142.5" y="416" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Reverse vocabulary map</text><path d="M255 389 H270" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="277" y="330" width="225" height="117" rx="13" fill="#f0edff" stroke="#a091d3" stroke-width="2"/><text x="389.5" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">BPE decode</text><text x="389.5" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Recover coefficients</text><text x="389.5" y="416" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Validate + reshape 10 × 7</text><path d="M502 389 H517" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="524" y="330" width="225" height="117" rx="13" fill="#e6f7f4" stroke="#64afa2" stroke-width="2"/><text x="636.5" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Undo scaling</text><text x="636.5" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Divide coefficients</text><text x="636.5" y="416" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">by 10</text><path d="M749 389 H764" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="771" y="330" width="225" height="117" rx="13" fill="#e6f7f4" stroke="#64afa2" stroke-width="2"/><text x="883.5" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Temporal IDCT</text><text x="883.5" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Reconstruct normalized</text><text x="883.5" y="416" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">10 × 7 action chunk</text><path d="M996 389 H1011" fill="none" stroke="#658299" stroke-width="3" marker-end="url(#arrow)"/><rect x="1018" y="330" width="225" height="117" rx="13" fill="#e6f7f4" stroke="#64afa2" stroke-width="2"/><text x="1130.5" y="362" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#304359" text-anchor="middle">Robot commands</text><text x="1130.5" y="392" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">Undo normalization</text><text x="1130.5" y="416" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">+ output transforms</text><text x="30" y="315" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#305783" text-anchor="start">INFERENCE</text><text x="650" y="491" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#304359" text-anchor="middle">All 7 action dimensions—including the gripper—use FAST. Vocabulary size is not action-chunk size.</text></svg>